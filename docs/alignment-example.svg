<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img" aria-labelledby="title desc">
<title id="title">Three matches, one gap: an inspectable global alignment</title>
<desc id="desc">Needleman-Wunsch aligns ACGT with A-GT. Match reward 2, mismatch cost 1, gap cost 2. The 5 by 4 score matrix ends at 4; highlighted cells follow the returned alignment.</desc>
